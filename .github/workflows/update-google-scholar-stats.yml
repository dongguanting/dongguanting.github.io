name: Update Google Scholar stats

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install crawler dependencies
        run: pip install -r google_scholar_crawler/requirements.txt

      - name: Fetch Google Scholar data
        id: fetch
        timeout-minutes: 5
        # Google Scholar 经常直接拒绝 GitHub runner 的出口 IP。抓取失败时
        # 只发一条 warning，不让整个 workflow 变红——本机跑 ./update_scholar.sh 才是可靠路径。
        continue-on-error: true
        env:
          GOOGLE_SCHOLAR_ID: amozZDkAAAAJ
          MAX_RETRIES: "3"
        run: |
          cd google_scholar_crawler
          python main.py
          cp results/gs_data.json /tmp/gs_data.json
          cp results/gs_data_shieldsio.json /tmp/gs_data_shieldsio.json

      - name: Report skipped update
        if: steps.fetch.outcome != 'success'
        run: |
          echo "::warning::Google Scholar fetch failed (likely IP-blocked on the runner). Citation data left unchanged; run ./update_scholar.sh locally to refresh."

      - name: Publish citation data
        if: steps.fetch.outcome == 'success'
        run: |
          cp /tmp/gs_data.json gs_data.json
          cp /tmp/gs_data_shieldsio.json gs_data_shieldsio.json
          git add gs_data.json gs_data_shieldsio.json

          if git diff --staged --quiet; then
            echo "Citation data is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update Google Scholar stats"
          git push origin HEAD:master
